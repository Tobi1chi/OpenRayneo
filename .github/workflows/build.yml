name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Bridge & Audio Driver
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain versions
        run: |
          swift --version
          clang --version
      - name: Run C11 audio ring & clock tests
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            Tests/AudioDriverTests/test_audio_ring.c \
            -o /tmp/test_audio_ring
          /tmp/test_audio_ring
          rm -f /tmp/test_audio_ring
      - name: Install libopus
        run: brew install opus
      - name: Run SwiftPM unit tests
        run: swift test
      - name: Build macOS app & Universal HAL driver
        run: sh scripts/build-app.sh
      - name: Validate app and driver bundles
        run: |
          plutil -lint OpenRayneoBridge.app/Contents/Info.plist
          test -x OpenRayneoBridge.app/Contents/MacOS/openrayneo-bridge
          test -f OpenRayneoBridge.app/Contents/Resources/OpenRayneoAudio.pkg
          lipo -archs .build/audio-driver/OpenRayneoAudio.driver/Contents/MacOS/OpenRayneoAudio | grep -q arm64
          lipo -archs .build/audio-driver/OpenRayneoAudio.driver/Contents/MacOS/OpenRayneoAudio | grep -q x86_64
          codesign --verify --strict .build/audio-driver/OpenRayneoAudio.driver
          codesign --verify --strict OpenRayneoBridge.app

  android:
    name: Android App & Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate shell and Python scripts
        run: |
          sh -n scripts/build-app.sh scripts/build-audio-driver.sh scripts/package-audio-driver.sh scripts/package-release.sh
          python3 -m py_compile scripts/phone-codex.py .agents/skills/openrayneo-api/scripts/request.py
      - name: Run Android unit tests, lint, and R8 release build
        run: |
          ./android/gradlew -p android testDebugUnitTest lintDebug assembleRelease --stacktrace
          test -f android/app/build/outputs/apk/release/app-release.apk
